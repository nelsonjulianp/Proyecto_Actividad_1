# Configuración del proyecto de detección de fraude (Actividad 3)

datos:
  ruta: data/train.csv

division:
  test_size: 0.2
  random_state: 42          # Semilla para reproducibilidad

# Modelos candidatos a comparar en el entrenamiento.
candidatos:
  - nombre_run: fraude-logit-c1
    tipo: logistic_regression
    parametros:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
      random_state: 42

  - nombre_run: fraude-lgbm-opt
    tipo: lightgbm
    parametros:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 63
      scale_pos_weight: 15.71   # Ponderación por el desbalance 94/6
      random_state: 42
      verbose: -1

  - nombre_run: fraude-xgb-base
    tipo: xgboost
    parametros:
      n_estimators: 250
      learning_rate: 0.05
      max_depth: 6
      scale_pos_weight: 15.71
      eval_metric: auc
      random_state: 42

mlflow:
  tracking_uri: http://localhost:5000
  experimento: fraude-detection-mlops
  nombre_run: corrida-entrenamiento

metricas:
  umbral: 0.5               # Punto de corte para clasificar Fraude = 1

registro:
  nombre_modelo: fraude-modelo     # Nombre en el Model Registry de MLflow
  umbral_auc: 0.85                 # AUC mínimo para poder aspirar a champion

inferencia:
  tamano_lote: 500                 # Transacciones a puntuar en la ejecución
  carpeta_salida: data/predicciones
  nivel_drift: 0.6                 # Emulación de drift: 0.0 (sin drift), 0.3 (moderado), 0.6 (alto)

# Actividad 3: detección de drift
monitoreo:
  lote_actual: lotes/lote_actual.csv  # Copia del lote puntuado para los flows de drift
  umbral_drift: 0.25                  # Fracción de variables con drift (2/7 = 28.6% > 25% dispara alerta)
  alfa_evento: 0.05                   # p-valor por debajo del cual se alerta drift en Fraude
  carpeta_reportes: reports           # Carpeta donde se guardan los reportes HTML de Evidently