# Configuración del proyecto de detección de fraude (Actividad 2)

datos:
  ruta: data/train.csv

division:
  test_size: 0.2
  random_state: 42          # Semilla para reproducibilidad

# Modelos candidatos a comparar en el entrenamiento.
# Prefect entrenará cada candidato y MLflow coronará con el alias 'champion' al de mayor AUC.
candidatos:
  - nombre_run: fraude-logit-c1
    tipo: logistic_regression
    parametros:
      C: 1.0
      max_iter: 1000
      class_weight: balanced
      random_state: 42

  - nombre_run: fraude-lgbm-opt
    tipo: lightgbm
    parametros:
      n_estimators: 300
      learning_rate: 0.03
      num_leaves: 63
      scale_pos_weight: 15.71   # Ponderación por el desbalance 94/6
      random_state: 42
      verbose: -1

  - nombre_run: fraude-xgb-base
    tipo: xgboost
    parametros:
      n_estimators: 250
      learning_rate: 0.05
      max_depth: 6
      scale_pos_weight: 15.71
      eval_metric: auc
      random_state: 42

mlflow:
  tracking_uri: http://localhost:5000
  experimento: fraude-detection-mlops
  nombre_run: corrida-entrenamiento

metricas:
  umbral: 0.5               # Punto de corte para clasificar Fraude = 1

registro:
  nombre_modelo: fraude-modelo     # Nombre en el Model Registry de MLflow
  umbral_auc: 0.85                 # AUC mínimo para poder aspirar a champion

inferencia:
  tamano_lote: 100                 # Transacciones a puntuar en la ejecución diaria
  carpeta_salida: data/predicciones